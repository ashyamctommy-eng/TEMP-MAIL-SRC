services:
  goldenmail:
    build: .
    container_name: goldenmail
    restart: unless-stopped
    ports:
      - "3000:3000"   # web app + admin
      - "25:25"       # inbound SMTP
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
